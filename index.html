  <body>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    <div id="root"></div>
